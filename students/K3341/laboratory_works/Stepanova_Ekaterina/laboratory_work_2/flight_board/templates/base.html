<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flight Board{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <nav class="navbar navbar-dark" style="background-color: #2266d6 !important;">
            <div class="container">
                <a class="navbar-brand fw-bold" href="{% url 'home' %}">✈️ Flight Board</a>

                <div class="d-flex gap-3 align-items-center">
                    {% if user.is_authenticated %}
                        <span class="text-white fw-medium">
                            {{ user.username }}
                        </span>
                        <a href="{% url 'my_reservations' %}" class="btn btn-outline-light btn-sm">
                            Заказы
                        </a>
                        <!-- Безопасный выход через POST-запрос (стандарт Django) -->
                        <form action="{% url 'logout' %}" method="post" class="d-inline m-0">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-light btn-sm">Выйти</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-light btn-sm">
                            Войти
                        </a>
                        <a href="{% url 'register' %}" class="btn btn-outline-light btn-sm">
                            Регистрация
                        </a>
                    {% endif %}

                    {% if user.is_staff %}
                        <a href="/admin/" class="btn btn-warning btn-sm fw-semibold">
                            Админка
                        </a>
                    {% endif %}
                </div>
            </div>
        </nav>
    </header>

    <main class="container py-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white py-3 mt-auto">
        <div class="container text-center">
            <small class="text-white-50">
                Flight Board
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
