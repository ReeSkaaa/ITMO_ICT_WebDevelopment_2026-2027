{% extends 'base.html' %}

{% block title %}
Добавление пассажира
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">

        <div class="card shadow-sm">
            <div class="card-body">

                <h1 class="h4 mb-3">
                    Регистрация пассажира
                </h1>

                <p class="text-muted mb-4">
                    Рейс {{ flight.flight_number }} —
                    {{ flight.airline }}
                </p>

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">
                            ФИО пассажира
                        </label>

                        <input
                            type="text"
                            name="full_name"
                            value="{{ full_name|default:'' }}"
                            class="form-control"
                            placeholder="Иванов Иван Иванович"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Номер билета
                        </label>

                        <input
                            type="text"
                            name="ticket_number"
                            value="{{ ticket_number|default:'' }}"
                            class="form-control"
                            placeholder="TCK-00125"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label">
                            Номер места
                        </label>

                        <input
                            type="text"
                            name="seat_number"
                            value="{{ seat_number|default:'' }}"
                            class="form-control"
                            placeholder="12A"
                            required
                        >
                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Зарегистрировать
                        </button>

                        <a
                            href="{% url 'flight_detail' flight.id %}"
                            class="btn btn-outline-secondary"
                        >
                            Отмена
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
