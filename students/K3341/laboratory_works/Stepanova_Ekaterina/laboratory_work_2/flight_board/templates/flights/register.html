{% extends 'base.html' %}

{% block title %}
Регистрация
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    Регистрация
                </h2>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-danger">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Логин
                        </label>

                        <input
                            type="text"
                            name="username"
                            id="username"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Пароль
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="password2" class="form-label">
                            Повторите пароль
                        </label>

                        <input
                            type="password"
                            name="password2"
                            id="password2"
                            class="form-control"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Зарегистрироваться
                    </button>
                </form>

                <div class="text-center mt-3">
                    Уже есть аккаунт?

                    <a href="{% url 'login' %}">
                        Войти
                    </a>
                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
