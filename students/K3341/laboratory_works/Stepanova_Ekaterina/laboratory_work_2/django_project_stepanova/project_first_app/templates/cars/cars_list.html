{% extends 'base.html' %}
{% block content %}
<h1> Список автомобилей </h1>
<ul>
    {% for car in object_list %}
    <li> {{ car.brand }} {{ car.model }}</li>
    <a href="{% url 'car_detail' car.pk %}">Перейти</a>
    {% empty %}
    <li> Машины не найдены</li>
    {% endfor %}
</ul>
<a href="{% url 'car_create' %}"> Создать </a>
{% endblock %}
